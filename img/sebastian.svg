<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Ilustración de Sebastián Castaño Duque" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .linea { stroke: #1B1618; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
    .persona { animation: flota 3s ease-in-out infinite; }
    .ojos { transform-box: fill-box; transform-origin: center; animation: parpadeo 4s infinite; }
    @keyframes flota { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes parpadeo { 0%, 90%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    @media (prefers-reduced-motion: reduce) { .persona, .ojos { animation: none; } }
  </style>
  <defs>
    <clipPath id="circulo"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>
  <g clip-path="url(#circulo)">
    <rect width="200" height="200" fill="#9EBEED"/>
    <g class="persona">
      <!-- Cuerpo pequeno con buzo gris -->
      <path class="linea" fill="#9AA0A6" d="M66 215 L68 176 C70 160 86 152 100 152 C114 152 130 160 132 176 L134 215 Z"/>
      <ellipse class="linea" cx="64" cy="184" rx="7" ry="12" fill="#9AA0A6"/>
      <ellipse class="linea" cx="136" cy="184" rx="7" ry="12" fill="#9AA0A6"/>
      <ellipse class="linea" cx="64" cy="198" rx="6" ry="6" fill="#E0A981"/>
      <ellipse class="linea" cx="136" cy="198" rx="6" ry="6" fill="#E0A981"/>
      <path class="linea" fill="#7F858B" d="M84 152 Q100 168 116 152 Q100 148 84 152 Z"/>
      <path d="M94 164 L93 186 M106 164 L107 186" stroke="#EDEDED" stroke-width="2.6" stroke-linecap="round"/>
      <!-- Orejas y cara redonda -->
      <circle class="linea" cx="62" cy="116" r="7" fill="#E0A981"/>
      <circle class="linea" cx="138" cy="116" r="7" fill="#E0A981"/>
      <ellipse class="linea" cx="100" cy="112" rx="38" ry="35" fill="#E0A981"/>
      <!-- Pelo corto -->
      <path class="linea" fill="#1B1618" d="M61 108 C58 78 76 62 100 62 C124 62 142 78 139 108 C134 92 122 85 100 85 C78 85 66 92 61 108 Z"/>
      <!-- Barba y bigote -->
      <path fill="#3A2A20" stroke="#1B1618" stroke-width="2.4" stroke-linejoin="round" d="M63 122 C64 146 82 150 100 150 C118 150 136 146 137 122 C132 132 126 134 120 133 C112 128 88 128 80 133 C74 134 68 132 63 122 Z"/>
      <path fill="#3A2A20" d="M84 129 C90 124 96 127 100 129 C104 127 110 124 116 129 C110 133 104 131 100 132 C96 131 90 133 84 129 Z"/>
      <!-- Cejas, ojos grandes -->
      <path d="M74 102 Q83 97 92 101 M108 101 Q117 97 126 102" fill="none" stroke="#1B1618" stroke-width="2.6" stroke-linecap="round"/>
      <g class="ojos">
        <ellipse cx="83" cy="114" rx="8.5" ry="10" fill="#1B1618"/>
        <ellipse cx="117" cy="114" rx="8.5" ry="10" fill="#1B1618"/>
        <circle cx="86" cy="110" r="2.5" fill="#FFFFFF"/>
        <circle cx="120" cy="110" r="2.5" fill="#FFFFFF"/>
      </g>
      <!-- Mejillas, nariz y sonrisa con brackets -->
      <ellipse cx="68" cy="126" rx="6.5" ry="4.5" fill="#E07A5F" opacity="0.45"/>
      <ellipse cx="132" cy="126" rx="6.5" ry="4.5" fill="#E07A5F" opacity="0.45"/>
      <path d="M98 123 Q100 125 102 123" fill="none" stroke="#A66A48" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M90 134 Q100 146 110 134 Q100 138 90 134 Z" fill="#FFFFFF" stroke="#1B1618" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M93 136.5 L107 136.5" stroke="#9AA0A6" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
