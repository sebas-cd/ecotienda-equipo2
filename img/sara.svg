<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Ilustración de Sara Jaramillo Causil" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    /* Cambien estas lineas para cambiar el color del pelo */
    .pelo { fill: #1B1618; }
    .hebra { fill: none; stroke: #5A4E54; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .linea { stroke: #1B1618; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
    .persona { animation: flota 3s ease-in-out infinite; animation-delay: -1s; }
    .ondea { transform-origin: 100px 60px; animation: ondea 4s ease-in-out infinite; }
    .ojos { transform-box: fill-box; transform-origin: center; animation: parpadeo 4s infinite; animation-delay: -2s; }
    @keyframes flota { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes ondea { 0%, 100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
    @keyframes parpadeo { 0%, 90%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    @media (prefers-reduced-motion: reduce) { .persona, .ondea, .ojos { animation: none; } }
  </style>
  <defs>
    <clipPath id="circulo"><circle cx="100" cy="100" r="100"/></clipPath>
    <g id="hebras"><path class="hebra" d="M97.4 62.1 L94.0 60.4 L91.9 64.4 L89.1 65.3 L85.0 63.3 L83.2 66.6 L81.9 69.9 L77.5 69.0 L75.2 71.1 L75.5 75.5 L72.1 76.5 L68.7 77.8 L69.8 82.1 L68.5 84.6 L64.5 86.2 L65.2 89.7 L66.2 93.1 L62.7 95.3 L62.2 98.4 L64.9 101.6 L63.0 104.5 L61.2 107.5 L64.1 110.5 L64.1 113.5 L61.3 116.5 L63.0 119.5 L64.7 122.5 L62.0 125.5 L62.0 128.5 L64.6 131.5 L63.0 134.5 L61.5 137.5 L63.9 140.5 L63.9 143.5 L61.5 146.5 L63.0 149.5 L64.4 152.5 L62.1 155.5"/><path class="hebra" d="M97.7 66.9 L95.0 69.6 L92.7 72.3 L88.7 70.1 L86.0 71.7 L85.3 76.0 L81.7 76.2 L78.1 77.0 L78.7 81.4 L76.9 83.7 L72.7 84.8 L73.2 88.4 L73.9 91.8 L70.0 93.8 L69.5 96.8 L72.0 100.2 L69.9 103.0 L68.2 106.0 L71.2 109.0 L71.0 112.0 L68.3 115.0 L70.1 118.0 L71.6 121.0 L68.9 124.0 L69.1 127.0 L71.6 130.0 L69.9 133.0 L68.5 136.0 L71.0 139.0 L70.9 142.0 L68.5 145.0 L70.1 148.0 L71.4 151.0"/><path class="hebra" d="M98.3 74.9 L96.0 78.7 L92.5 77.3 L88.9 77.1 L88.3 81.7 L86.0 83.3 L81.6 83.5 L81.7 87.4 L81.8 90.8 L77.7 92.2 L77.1 95.3 L79.4 98.8 L76.9 101.4 L75.2 104.5 L78.2 107.5 L78.0 110.5 L75.2 113.5 L77.2 116.5 L78.6 119.5 L75.9 122.5 L76.1 125.5 L78.6 128.5 L76.9 131.5 L75.5 134.5 L78.0 137.5 L77.8 140.5 L75.5 143.5 L77.1 146.5"/><path class="hebra" d="M99.1 84.6 L96.3 84.7 L92.1 83.1 L91.1 87.0 L90.4 90.2 L85.9 90.7 L84.9 93.8 L86.9 97.6 L84.0 99.9 L82.2 102.9 L85.3 105.9 L84.9 108.9 L82.2 111.9 L84.2 114.9 L85.6 117.9 L82.8 120.9 L83.2 123.9 L85.7 126.9 L83.8 129.9 L82.5 132.9 L85.1 135.9 L84.7 138.9 L82.5 141.9"/></g>
