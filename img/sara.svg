      <path class="pelo" d="M60 112 C56 80 76 62 100 62 C124 62 144 80 140 112 C136 98 126 88 114 85 C107 83 102 85 100 91 C98 85 93 83 86 85 C74 88 64 98 60 112 Z"/>
      <path class="hebra" d="M100 63 L100 88"/>
      <path d="M72 80 C80 72 90 70 98 72 M102 72 C110 70 120 72 128 80" fill="none" stroke="#5A4E54" stroke-width="1.6" stroke-linecap="round"/>
      <!-- Cejas, ojos grandes y pestanas -->
      <path d="M74 103 Q83 98 92 102 M108 102 Q117 98 126 103" fill="none" stroke="#1B1618" stroke-width="2.4" stroke-linecap="round"/>
      <g class="ojos">
        <ellipse cx="83" cy="117" rx="9" ry="10.5" fill="#1B1618"/>
        <ellipse cx="117" cy="117" rx="9" ry="10.5" fill="#1B1618"/>
