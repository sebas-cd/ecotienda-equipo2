      <!-- Mejillas, nariz y sonrisa -->
      <ellipse cx="68" cy="128" rx="7" ry="5" fill="#F08A8A" opacity="0.6"/>
      <ellipse cx="132" cy="128" rx="7" ry="5" fill="#F08A8A" opacity="0.6"/>
