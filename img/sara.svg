      <ellipse class="linea" cx="68" cy="184" rx="7" ry="12" fill="#DCEBF7"/>
      <ellipse class="linea" cx="132" cy="184" rx="7" ry="12" fill="#DCEBF7"/>
      <ellipse class="linea" cx="68" cy="198" rx="6" ry="6" fill="#C98F68"/>
      <ellipse class="linea" cx="132" cy="198" rx="6" ry="6" fill="#C98F68"/>
      <path class="linea" fill="#C98F68" d="M90 151 Q100 160 110 151 Z"/>
      <!-- Cara redonda -->
      <ellipse class="linea" cx="100" cy="112" rx="38" ry="35" fill="#C98F68"/>
