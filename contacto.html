<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto · VatioCero</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="container py-3">
    <header class="encabezado">
        <h1>Atención y Asesoría</h1>
        <p>Consúltenos para diagnosticar la eficiencia de su inmueble o comercio.</p>
        <nav class="menu">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main>
        <section class="formulario-seccion">
            <h2>Formulario de contacto</h2>
            <form action="#" method="POST" class="formulario-contacto">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" required placeholder="Ej. Cosme Fulanito">
                </div>

                <div class="mb-3">
                    <label for="correo" class="form-label">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" class="form-control" required placeholder="cosme@fulanito.com">
                </div>

                <div class="mb-3">
                    <label for="telefono" class="form-label">Número de teléfono celular:</label>
                    <input type="tel" id="telefono" name="telefono" class="form-control" placeholder="Ej. 3001234567">
                </div>

                <div class="mb-3">
                    <label for="interes" class="form-label">Sector o categoría de mayor interés:</label>
                    <select id="interes" name="interes" class="form-select">
                        <option value="" disabled selected>Seleccione un sector o categoría</option>
                        <option value="iluminacion">Iluminación LED Residencial/Comercial</option>
                        <option value="electrodomesticos">Reemplazo de Refrigeración y Climatización Inverter</option>
                        <option value="solar">Sistemas Solares Fotovoltaicos Aislados o Conectados</option>
                        <option value="auditoria">Diagnóstico general de factura energética</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="mensaje" class="form-label">Mensaje o detalle de su requerimiento:</label>
                    <textarea id="mensaje" name="mensaje" rows="4" class="form-control" required placeholder="Describa los equipos actuales que desea evaluar..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100">Enviar solicitud</button>
            </form>
        </section>
    </main>

    <footer class="pie">
        <p>Atención al usuario y soporte técnico · VatioCero</p>
        <p>Ingeniería Web I · IU Digital de Antioquia · 2026-2</p>
    </footer>
</body>
</html>
